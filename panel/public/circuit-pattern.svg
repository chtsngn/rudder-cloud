<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <pattern id="circuit" x="0" y="0" width="500" height="500" patternUnits="userSpaceOnUse">
      <!-- Horizontal traces -->
      <line x1="0" y1="60" x2="120" y2="60" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="120" y1="60" x2="120" y2="120" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="120" y1="120" x2="240" y2="120" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="240" y1="120" x2="240" y2="60" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="240" y1="60" x2="400" y2="60" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="400" y1="60" x2="400" y2="30" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="400" y1="30" x2="500" y2="30" stroke="#2e3038" stroke-width="1.5"/>

      <!-- More horizontal traces -->
      <line x1="0" y1="180" x2="80" y2="180" stroke="#282b34" stroke-width="1"/>
      <line x1="80" y1="180" x2="80" y2="220" stroke="#282b34" stroke-width="1"/>
      <line x1="80" y1="220" x2="200" y2="220" stroke="#282b34" stroke-width="1"/>
      <line x1="200" y1="220" x2="200" y2="160" stroke="#282b34" stroke-width="1"/>
      <line x1="200" y1="160" x2="360" y2="160" stroke="#282b34" stroke-width="1"/>
      <line x1="360" y1="160" x2="360" y2="200" stroke="#282b34" stroke-width="1"/>
      <line x1="360" y1="200" x2="500" y2="200" stroke="#282b34" stroke-width="1"/>

      <!-- Vertical segment traces -->
      <line x1="50" y1="0" x2="50" y2="60" stroke="#2a2d36" stroke-width="1.5"/>
      <line x1="300" y1="0" x2="300" y2="30" stroke="#2a2d36" stroke-width="1.5"/>
      <line x1="460" y1="0" x2="460" y2="60" stroke="#2a2d36" stroke-width="1.5"/>

      <!-- Lower section traces -->
      <line x1="0" y1="320" x2="140" y2="320" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="140" y1="320" x2="140" y2="280" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="140" y1="280" x2="280" y2="280" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="280" y1="280" x2="280" y2="340" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="280" y1="340" x2="420" y2="340" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="420" y1="340" x2="420" y2="300" stroke="#2e3038" stroke-width="1.5"/>
      <line x1="420" y1="300" x2="500" y2="300" stroke="#2e3038" stroke-width="1.5"/>

      <line x1="0" y1="420" x2="100" y2="420" stroke="#282b34" stroke-width="1"/>
      <line x1="100" y1="420" x2="100" y2="460" stroke="#282b34" stroke-width="1"/>
      <line x1="100" y1="460" x2="220" y2="460" stroke="#282b34" stroke-width="1"/>
      <line x1="220" y1="460" x2="220" y2="400" stroke="#282b34" stroke-width="1"/>
      <line x1="220" y1="400" x2="380" y2="400" stroke="#282b34" stroke-width="1"/>
      <line x1="380" y1="400" x2="380" y2="440" stroke="#282b34" stroke-width="1"/>
      <line x1="380" y1="440" x2="500" y2="440" stroke="#282b34" stroke-width="1"/>

      <!-- Connector pads (nodes/vias) -->
      <circle cx="120" cy="60" r="3.5" fill="none" stroke="#333740" stroke-width="1.5"/>
      <circle cx="240" cy="60" r="3.5" fill="none" stroke="#333740" stroke-width="1.5"/>
      <circle cx="400" cy="60" r="3.5" fill="none" stroke="#333740" stroke-width="1.5"/>
      <circle cx="80" cy="180" r="3" fill="none" stroke="#2e3240" stroke-width="1"/>
      <circle cx="200" cy="160" r="3" fill="none" stroke="#2e3240" stroke-width="1"/>
      <circle cx="360" cy="160" r="3" fill="none" stroke="#2e3240" stroke-width="1"/>
      <circle cx="140" cy="280" r="3.5" fill="none" stroke="#333740" stroke-width="1.5"/>
      <circle cx="280" cy="280" r="3.5" fill="none" stroke="#333740" stroke-width="1.5"/>
      <circle cx="420" cy="300" r="3.5" fill="none" stroke="#333740" stroke-width="1.5"/>
      <circle cx="100" cy="420" r="3" fill="none" stroke="#2e3240" stroke-width="1"/>
      <circle cx="220" cy="400" r="3" fill="none" stroke="#2e3240" stroke-width="1"/>
      <circle cx="380" cy="400" r="3" fill="none" stroke="#2e3240" stroke-width="1"/>

      <!-- Small filled vias -->
      <circle cx="50" cy="60" r="2" fill="#2e3038"/>
      <circle cx="300" cy="30" r="2" fill="#2e3038"/>
      <circle cx="460" cy="60" r="2" fill="#2e3038"/>
      <circle cx="120" cy="120" r="2" fill="#2a2d36"/>
      <circle cx="240" cy="120" r="2" fill="#2a2d36"/>
      <circle cx="140" cy="320" r="2" fill="#2e3038"/>
      <circle cx="280" cy="340" r="2" fill="#2e3038"/>
      <circle cx="420" cy="340" r="2" fill="#2e3038"/>

      <!-- Diagonal accent traces - subtle -->
      <line x1="180" y1="0" x2="180" y2="60" stroke="#252831" stroke-width="1"/>
      <line x1="340" y1="160" x2="340" y2="220" stroke="#252831" stroke-width="1"/>
      <line x1="60" y1="280" x2="60" y2="360" stroke="#252831" stroke-width="1"/>
      <line x1="480" y1="400" x2="480" y2="500" stroke="#252831" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="500" height="500" fill="url(#circuit)" opacity="0.9"/>
</svg>
